[project]
name = "semiconductor-rnd-agent"
version = "0.1.0"
description = "LangGraph 기반 차세대 반도체 R&D 기술 전략 분석 에이전트"
readme = "README.md"
requires-python = "==3.11.7"

dependencies = [
    # 1. 코어 프레임워크 및 환경 관리
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.0.10",
    "jupyter>=1.0.0",        
    "python-dotenv>=1.0.0",
    "langchain-huggingface>=0.0.1",    # HuggingFaceEmbeddings용
    "sentence-transformers>=2.2.0",    # bge-m3 모델 구동용
    "huggingface-hub>=0.20.0",        # 모델 다운로드 관리

    # 2. 데이터 수집 에이전트 도구 (Web / API)
    "tavily-python>=0.3.0",          # 웹/뉴스 검색 API
    "arxiv>=2.1.0",                  # 논문 수집 API
    "google-search-results>=2.4.2",  # SerpApi 특허 수집 API

    # 3. RAG 파이프라인 (데이터 파싱 및 로컬 벡터 DB)
    "pypdf>=4.0.0",                    # 수동 동향지 PDF 읽기
    "langchain-text-splitters>=0.0.1", # 텍스트 청킹(자르기) 도구
    "sentence-transformers>=2.2.0",    # 로컬 BAAI/bge-m3 임베딩 엔진
    "langchain-huggingface>=0.0.1",    # 랭체인-허깅페이스 연동
    "chromadb>=0.4.20",                # 로컬 벡터 데이터베이스
    "tiktoken>=0.5.0",                 # 텍스트 토큰화 계산기

    # 4. 최종 보고서 산출 도구
    "markdown>=3.5.0",
    "reportlab>=4.0.0",     # PDF 생성 (ReportLab 기반, 한글 폰트 정상 지원)
    "pdfplumber>=0.10.0",   # PDF 텍스트·표 추출 (디버깅·검증용)
    # "xhtml2pdf>=0.2.11"   # 구버전 방식 (한글 표 깨짐 이슈로 대체됨)
]